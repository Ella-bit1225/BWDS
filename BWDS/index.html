    <body>
        
        <header>
            <div class="header-left">
                <div class="Logo">
                    <img class="logo-normal" src="images/Logo/Logo1.png" alt="BWDS">
                    <img class="logo-hover" src="images/Logo/Logo2.png" alt="BWDS">
                </div>
            </div>
            <nav>
                <ul>
                    <li>
                        <a href="#">
                            <span class="zh">首頁</span>
                            <span class="en">HOME</span>
                        </a>
                    </li>
                    
                    <li>
                        <a href="#">
                            <span class="zh">關於BWDS</span>
                            <span class="en">ABOUT BWDS</span>
                        </a>
                    </li>

                    <li>
                        <a href="#">
                            <span class="zh">所有產品</span>
                            <span class="en">PRODUCT</span>
                        </a>
                    </li>

                    <li>
                        <a href="#">
                            <span class="zh">彌月訂購</span>
                            <span class="en">FULL MONTH</span>
                        </a>
                    </li>

                    <li>

                            <span class="zh">最新消息</span>

                    </li>

                    <li>

                        </a>
                    </li>

                    <li>
                        <a href="#">
                            <span class="zh">常見問題</span>
                            <span class="en">Q&A</span>
                        </a>
                    </li>
                </ul>
            </nav>

            <div class="header-right">
                <img class="member" src="images/member/pi.png">
                <img class="cart" src="images/member/sc.png">            
            </div>
        </header>
        <section class="banner">
            <div class="swiper">

                <div class="swiper-wrapper">
            
                    <div class="swiper-slide">
                        <img src="images/Banner/1.png">
                    </div>
            
                    <div class="swiper-slide">
                        <img src="images/Banner/2.png">
                    </div>
            
                    <div class="swiper-slide">
                        <img src="images/Banner/3.png">
                    </div>
    
                    <div class="swiper-slide">
                        <img src="images/Banner/4.png">
                    </div>
    
                    <div class="swiper-slide">
                        <img src="images/Banner/5.png">
                    </div>
    
                    <div class="swiper-slide">
                        <img src="images/Banner/6.png">
                    </div>
            
                </div>
                
                <img class="my-prev" src="images/Banner/left.png">
                <img class="my-next" src="images/Banner/right.png">
            
            </div>
        </section>
        <section class="about">

            <div class="about-content">
                <p>BWDS不僅僅是品嚐甜點的地方</p>
                <p>更是探索美味與夢想的心靈港灣</p>
                <p>每一款甜點就像藍鯨一般</p>
                <p>承載著創作者的夢想與情感</p>
                <p>在繁忙中尋找片刻安寧</p>
                <p>像藍鯨般寧靜且自由</p>
            </div>
        
            <div class="about-title">
                <span>ABOUT</span>
            </div>
        
        </section>
        <section class="product">
            <div class="item">
                <img src="images/M/M2.png" alt="cookie">
                <img src="images/M/M3.png">
                <img src="images/M/M4.png" alt="tart">
            </div>
        </section>
        <footer>
            <div>聯絡我們 </div>
            <div>會員專區 </div>
            <div>其他資訊 </div>
            <div>營業資訊 </div>
            <div><img src="images/Footer/Group 5.png" alt="BWDS"></div>
            <div><img src="images/Footer/IconF.png" alt="Facebook"></div>
            <div><img src="images/Footer/IconM.png" alt="Message"></div>
            <div><img src="images/Footer/IconT.png" alt="Twitter"></div>
        </footer>
